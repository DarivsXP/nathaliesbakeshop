databases:
  - name: nathaliesbakeshop-db
    plan: free
    databaseName: nathaliesbakeshop
    user: nathaliesbakeshop

services:
  - type: web
    name: nathaliesbakeshop
    runtime: docker
    plan: free
    healthCheckPath: /up
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nathaliesbakeshop-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: nathaliesbakeshop-db
          property: connectionString
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_NAME
        value: "Nathalie's Bakeshop"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
